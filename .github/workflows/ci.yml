name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # The schema uses PostgreSQL-specific types (UUID, JSONB, native enums),
      # so the tests need a real server rather than SQLite.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clauseguard
          POSTGRES_PASSWORD: clauseguard
          POSTGRES_DB: clauseguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clauseguard -d clauseguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://clauseguard:clauseguard@localhost:5432/clauseguard
      # Turns a skipped database test into a failure, so CI cannot pass green
      # by quietly skipping the tests that matter most.
      REQUIRE_DB: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Verify migrations apply to an empty database
        run: alembic upgrade head

      - name: Test
        run: pytest -v

      - name: Check the generated rubric documentation is current
        # docs/RUBRIC.md is generated from the rubric YAML. Regenerating it in
        # CI would hide drift; failing makes the author run the script.
        run: python scripts/generate_rubric_docs.py --check

      - name: Measure pipeline latency (TBD-3)
        # Informational: records the figure in the build log so a regression is
        # visible in history. Does not gate the build, because runner
        # performance varies too much to assert a threshold on.
        run: python scripts/measure_latency.py --clauses 50 --runs 3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        # `npm run build` runs `tsc -b` first, so a type error fails here.
        run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test the whole stack
        run: |
          docker compose up -d --build

          # Health through the API's own port.
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          curl -sf http://localhost:8000/api/v1/health | tee /dev/stderr | grep -q '"database":true'

          # The SPA, and the API through the nginx proxy — the path a browser
          # actually takes.
          curl -sf http://localhost:5173/ | grep -q "ClauseGuard"
          curl -sf http://localhost:5173/api/v1/health | grep -q '"status":"ok"'

          # Client-side routes must fall back to index.html, not 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/dashboard)" = "200"

      - name: End-to-end analysis through the proxy
        run: |
          BASE=http://localhost:5173/api/v1
          EMAIL="ci-$RANDOM@example.com"

          TOKEN=$(curl -sf -X POST $BASE/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"ci-password-123\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')

          # Generate a fixture contract using the project's own builder.
          pip install --quiet -r backend/requirements.txt
          python3 -c "
          import sys; sys.path.insert(0, 'backend')
          from tests.fixtures import make_pdf
          open('/tmp/contract.pdf','wb').write(make_pdf())
          "

          CID=$(curl -sf -X POST $BASE/contracts \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@/tmp/contract.pdf;type=application/pdf" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["contract_id"])')

          for _ in $(seq 1 40); do
            STATUS=$(curl -sf "$BASE/contracts/$CID/status" -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            echo "status: $STATUS"
            case "$STATUS" in complete) break;; failed) exit 1;; esac
            sleep 2
          done

          curl -sf "$BASE/reports/$CID" -H "Authorization: Bearer $TOKEN" \
            | python3 -c '
          import sys, json
          report = json.load(sys.stdin)
          assert report["clauses"], "report has no clauses"
          assert report["disclaimer"], "disclaimer missing"
          flagged = [c for c in report["clauses"] if c["findings"]]
          assert flagged, "fixture should produce findings"
          for clause in flagged:
              for finding in clause["findings"]:
                  assert finding["explanation"], "REQ-4.3: flag without an explanation"
          print(f"{len(report[\"clauses\"])} clauses, {len(flagged)} flagged")
          '

          curl -sf "$BASE/reports/$CID/pdf" -H "Authorization: Bearer $TOKEN" -o /tmp/report.pdf
          head -c 5 /tmp/report.pdf | grep -q '%PDF-'
          echo "PDF export ok ($(stat -c%s /tmp/report.pdf) bytes)"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
