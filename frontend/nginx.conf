server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 10 MB (TBD-1). Nginx must allow at least that or
    # it would reject the request before the API could return its own clear
    # message; the small margin covers multipart overhead.
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Proxy the API so the browser sees a single origin in production, which
    # keeps CORS out of the deployment entirely.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Analysis is queued, but a PDF export of a long contract can take a
        # few seconds to render.
        proxy_read_timeout 120s;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
