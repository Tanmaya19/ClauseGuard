# TLS-terminating configuration (SRS 5.3: "encrypt all data in transit").
#
# Used instead of nginx.conf when certificates are mounted at /etc/nginx/certs.
# docker-compose.tls.yml wires that up.
#
# Certificates are NOT in this repository. For local use, generate a
# self-signed pair with scripts/generate_dev_certs.sh. For a real deployment,
# use a CA-issued certificate — see docs/DEPLOYMENT.md.

# Redirect every plaintext request. No application traffic is served over
# port 80: a contract is commercially sensitive (SRS 5.3) and must not cross
# the network unencrypted even once before the redirect.
server {
    listen 80;
    server_name _;

    # ACME HTTP-01 challenge must stay reachable over plaintext, or
    # certificate renewal cannot complete.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.3 preferred, per SRS 3.4. TLS 1.2 retained because dropping it
    # would lock out older Android browsers, which matter for the SRS 2.4
    # mobile breakpoint; 1.0 and 1.1 are not offered at all.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---------------------------------------------
    # Two years, so the browser refuses plaintext for this host even if a
    # user types http://. Only safe once TLS is known to work — enabling it
    # on a broken certificate locks users out for the duration.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA loads no third-party scripts, so the policy can be strict.
    # 'unsafe-inline' for styles only: Vite inlines a small critical-CSS block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend needs to know the original scheme was HTTPS so any
        # URL it generates does not downgrade to http.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
